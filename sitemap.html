<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Map — Anokhi Ada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Yeseva+One&family=Jost:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF3E7;
    --maroon:#5C1A2B;
    --maroon-deep:#3D1120;
    --gold:#B8863B;
    --line:rgba(36,16,20,0.14);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--ivory); color:#241014;
    font-family:'Jost',sans-serif; line-height:1.6;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:700px; margin:0 auto; padding:80px 32px; }
  h1{
    font-family:'Cormorant Garamond',serif; font-size:clamp(36px,5vw,54px);
    color:var(--maroon); margin-bottom:8px;
  }
  p.sub{ color:#6b5a53; font-size:15px; margin-bottom:40px; }
  .section-list{ list-style:none; padding:0; margin:0; }
  .section-list li{ border-bottom:1px solid var(--line); }
  .section-list a{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 4px; font-size:18px; transition:color 0.2s ease;
  }
  .section-list a:hover{ color:var(--gold); }
  .section-list .arrow{ font-size:20px; color:var(--gold); }
  .back{
    display:inline-block; margin-top:44px; font-size:13px; letter-spacing:0.05em;
    text-transform:uppercase; border-bottom:1px solid var(--maroon); padding-bottom:2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Site Map</h1>
    <p class="sub">Every section of the Anokhi Ada website, in one place.</p>
    <ul class="section-list">
      <li><a href="index.html#top">Home <span class="arrow">&#8250;</span></a></li>
      <li><a href="index.html#services">Services <span class="arrow">&#8250;</span></a></li>
      <li><a href="index.html#sale">Sale <span class="arrow">&#8250;</span></a></li>
      <li><a href="index.html#lookbook">Lookbook <span class="arrow">&#8250;</span></a></li>
      <li><a href="index.html#about">About <span class="arrow">&#8250;</span></a></li>
      <li><a href="index.html#contact">Contact <span class="arrow">&#8250;</span></a></li>
    </ul>
    <a href="index.html" class="back">&#8249; Back to Home</a>
  </div>
</body>
</html>
